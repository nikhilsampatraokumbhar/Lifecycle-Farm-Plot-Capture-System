<figure class="fig">
<svg viewBox="0 0 700 216" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <defs><marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.2" orient="auto">
   <path d="M0,0 L6.5,3.2 L0,6.4 z" fill="#4E544C"/></marker>
  <marker id="a1g" markerWidth="7" markerHeight="7" refX="6" refY="3.2" orient="auto">

 <line x1="272" y1="8" x2="272" y2="208" stroke="#CDD2C7" stroke-width="1.4" stroke-dasharray="5 4"/>
 <text x="8" y="16" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">IN THE FIELD, NO SIGNAL, ALL DAY</text>
 <text x="284" y="16" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">AT HOME, ON WIFI, 8:30 PM</text>

 <rect x="8" y="72" width="112" height="62" rx="7" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.5"/>
 <text x="64" y="95" font-size="13" font-weight="700" text-anchor="middle" fill="#0A4F2C">Capture made</text>
 <text x="64" y="112" font-size="11" text-anchor="middle" fill="#4E544C">gets its own ID,</text>
 <text x="64" y="125" font-size="11" text-anchor="middle" fill="#4E544C">written once</text>
 <line x1="124" y1="103" x2="152" y2="103" stroke="#4E544C" stroke-width="1.5" marker-end="url(#a1)"/>

 <rect x="156" y="60" width="102" height="86" rx="7" fill="#fff" stroke="#CDD2C7" stroke-width="1.5"/>
 <text x="207" y="78" font-size="12.5" font-weight="700" text-anchor="middle" fill="#141613">Queue</text>
 <rect x="170" y="86" width="74" height="12" rx="3" fill="#DCE6DE"/>
 <rect x="170" y="102" width="74" height="12" rx="3" fill="#DCE6DE"/>
 <rect x="170" y="118" width="74" height="12" rx="3" fill="#DCE6DE"/>
 <text x="207" y="141" font-size="10" text-anchor="middle" fill="#858B81">20 visits waiting</text>

 <path d="M262,103 L278,103 L278,58 L300,58" fill="none" stroke="#0E6B3C" stroke-width="1.8" marker-end="url(#a1g)"/>
 <path d="M262,103 L278,103 L278,164 L300,164" fill="none" stroke="#858B81" stroke-width="1.8" marker-end="url(#a1)"/>

 <rect x="304" y="34" width="176" height="48" rx="7" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.5"/>

 <rect x="304" y="140" width="176" height="48" rx="7" fill="#fff" stroke="#CDD2C7" stroke-width="1.5"/>
 <text x="316" y="159" font-size="12.5" font-weight="700" fill="#141613">2 · Photos follow</text>
 <text x="316" y="176" font-size="11" fill="#4E544C">MB each · in chunks, resumable</text>

 <path d="M484,58 L520,58 L520,92" fill="none" stroke="#0E6B3C" stroke-width="1.8" marker-end="url(#a1g)"/>
 <path d="M484,164 L520,164 L520,132" fill="none" stroke="#858B81" stroke-width="1.8" marker-end="url(#a1)"/>

 <rect x="546" y="82" width="146" height="58" rx="7" fill="#141613"/>
 <text x="619" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Server</text>
 <text x="619" y="123" font-size="10.5" text-anchor="middle" fill="#B9C2B6">same ID twice? ignored</text>

 <rect x="304" y="94" width="176" height="34" rx="6" fill="#FDF3E2" stroke="#E0C48E" stroke-width="1.2"/>
 <text x="392" y="108" font-size="11" font-weight="700" text-anchor="middle" fill="#8A5206">The visit is usable</text>
 <text x="392" y="121" font-size="11" font-weight="700" text-anchor="middle" fill="#8A5206">from here onward</text>

<figcaption><b>Why the split matters.</b> A record is complete the moment its details land, so a slow photo never holds up the other nineteen visits.</figcaption>
