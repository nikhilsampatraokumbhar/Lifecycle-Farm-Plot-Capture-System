<figure class="fig">
<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <defs><pattern id="ov" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="6" stroke="#D4756C" stroke-width="2.6"/></pattern></defs>

 <text x="8" y="15" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">IS IT A DISPUTE, OR JUST TWO IMPRECISE MEASUREMENTS?</text>

 <!-- case A -->
 <g>
  <rect x="8" y="26" width="200" height="132" rx="7" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.4"/>
  <polygon points="26,58 106,50 112,124 32,132" fill="rgba(14,107,60,.18)" stroke="#0E6B3C" stroke-width="1.8"/>
  <polygon points="102,52 186,58 180,128 108,126" fill="rgba(31,86,115,.14)" stroke="#1F5673" stroke-width="1.8"/>
  <polygon points="102,52 106,50 112,124 108,126" fill="url(#ov)"/>
  <rect x="20" y="34" width="82" height="17" rx="4" fill="#fff" opacity=".9"/>
  <text x="26" y="46" font-size="10" font-weight="700" fill="#0A4F2C">overlap 0.04 ac</text>
  <text x="108" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#0A4F2C">Smaller than the error</text>
 </g>
 <text x="108" y="176" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141613">Measurement noise</text>
 <text x="108" y="192" font-size="10.5" text-anchor="middle" fill="#4E544C">Propose one shared line.</text>
 <text x="108" y="205" font-size="10.5" text-anchor="middle" fill="#4E544C">Both confirm next visit.</text>

 <!-- case B -->
 <g>
  <rect x="228" y="26" width="200" height="132" rx="7" fill="#FBE9E7" stroke="#9B211B" stroke-width="1.4"/>
  <polygon points="246,58 348,50 352,124 252,132" fill="rgba(14,107,60,.18)" stroke="#0E6B3C" stroke-width="1.8"/>
  <polygon points="300,52 406,58 400,128 306,126" fill="rgba(31,86,115,.14)" stroke="#1F5673" stroke-width="1.8"/>
  <polygon points="300,52 348,50 352,124 306,126" fill="url(#ov)"/>
  <rect x="240" y="34" width="76" height="17" rx="4" fill="#fff" opacity=".9"/>
  <text x="246" y="46" font-size="10" font-weight="700" fill="#9B211B">overlap 0.6 ac</text>
  <text x="328" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#9B211B">Bigger than the error</text>
 </g>
 <text x="328" y="176" font-size="11.5" font-weight="700" text-anchor="middle" fill="#141613">A real claim conflict</text>
 <text x="328" y="192" font-size="10.5" text-anchor="middle" fill="#4E544C">Both kept. Escalated to</text>
 <text x="328" y="205" font-size="10.5" text-anchor="middle" fill="#4E544C">someone with authority.</text>

 <!-- area steps -->
 <g transform="translate(452,0)">
  <text x="0" y="15" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">AND A SEASON ONLY GOES DOWN</text>
  <line x1="0" y1="146" x2="240" y2="146" stroke="#858B81" stroke-width="1.2"/>
  <rect x="4"   y="46"  width="34" height="100" fill="#0E6B3C"/>
  <rect x="44"  y="60"  width="34" height="86"  fill="#0E6B3C" opacity=".85"/>
  <rect x="84"  y="72"  width="34" height="74"  fill="#0E6B3C" opacity=".7"/>
  <rect x="124" y="44"  width="34" height="102" fill="#9B211B"/>
  <rect x="164" y="86"  width="34" height="60"  fill="#0E6B3C" opacity=".55"/>
  <rect x="204" y="94"  width="34" height="52"  fill="#0E6B3C" opacity=".4"/>
  <circle cx="141" cy="60" r="10" fill="#fff"/>
  <text x="141" y="65" font-size="13" font-weight="800" text-anchor="middle" fill="#9B211B">!</text>
  <text x="21"  y="158" font-size="8.5" text-anchor="middle" fill="#4E544C">contract</text>
  <text x="61"  y="158" font-size="8.5" text-anchor="middle" fill="#4E544C">sown</text>
  <text x="101" y="158" font-size="8.5" text-anchor="middle" fill="#4E544C">germ.</text>
  <text x="141" y="158" font-size="8.5" font-weight="700" text-anchor="middle" fill="#9B211B">pest</text>
  <text x="181" y="158" font-size="8.5" text-anchor="middle" fill="#4E544C">standing</text>
  <text x="221" y="158" font-size="8.5" text-anchor="middle" fill="#4E544C">harvest</text>
  <text x="0" y="178" font-size="11" fill="#4E544C">Crops do not spread on their own, so</text>
  <text x="0" y="192" font-size="11" font-weight="700" fill="#9B211B">any step upward needs a named reason.</text>
  <text x="0" y="205" font-size="10.5" fill="#4E544C">Re-sown · earlier capture wrong · extra land.</text>
 </g>
</svg>
<figcaption><b>Two questions that look identical on screen.</b> Calling an 8 metre measurement error a land dispute creates a fight between two people who have to keep farming next to each other.</figcaption>
</figure>
