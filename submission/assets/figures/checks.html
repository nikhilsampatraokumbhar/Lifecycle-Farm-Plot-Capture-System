<figure class="fig">
<svg viewBox="0 0 700 232" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <defs><marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.2" orient="auto">
   <path d="M0,0 L6.5,3.2 L0,6.4 z" fill="#858B81"/></marker></defs>

 <line x1="8" y1="30" x2="692" y2="30" stroke="#CDD2C7" stroke-width="1.4" marker-end="url(#a4)"/>
 <circle cx="60" cy="30" r="5" fill="#0E6B3C"/><circle cx="392" cy="30" r="5" fill="#141613"/>
 <text x="60" y="20" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0E6B3C">07:53 · capture saved</text>
 <text x="392" y="20" font-size="10.5" font-weight="700" text-anchor="middle" fill="#141613">20:34 · it syncs</text>
 <text x="226" y="20" font-size="10" text-anchor="middle" fill="#858B81">... twelve hours with no signal ...</text>

 <rect x="8" y="44" width="330" height="180" rx="8" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.5"/>
 <text x="22" y="64" font-size="12.5" font-weight="700" fill="#0A4F2C">On the phone, instantly</text>
 <text x="22" y="79" font-size="10.5" fill="#4E544C">The only moment a mistake is cheap to fix.</text>
 <line x1="22" y1="88" x2="324" y2="88" stroke="#B9DCC7"/>
 <g font-size="10.5" fill="#141613">
  <text x="22" y="104">Sown more than contracted</text>
  <text x="22" y="126">Off the contract by more than the stage allows</text>
  <text x="22" y="148">Shape crosses itself, or the loop is open</text>
  <text x="22" y="170">Overlaps the neighbour's plot</text>
  <text x="22" y="192">Captured far from where the plot should be</text>
  <text x="22" y="214">The walk looks impossible: too fast, too few points</text>
 </g>
 <g font-size="9.5" font-weight="700" text-anchor="end">
  <text x="324" y="104" fill="#9B211B">hard flag</text><text x="324" y="126" fill="#8A5206">reason + photo</text>
  <text x="324" y="148" fill="#8A5206">redo now</text><text x="324" y="170" fill="#9B211B">flag both</text>
  <text x="324" y="192" fill="#9B211B">hard flag</text><text x="324" y="214" fill="#8A5206">flag</text>
 </g>

 <rect x="362" y="44" width="330" height="180" rx="8" fill="#fff" stroke="#CDD2C7" stroke-width="1.5"/>
 <text x="376" y="64" font-size="12.5" font-weight="700" fill="#141613">On the server, that night</text>
 <text x="376" y="79" font-size="10.5" fill="#4E544C">Checks needing context one phone cannot have.</text>
 <line x1="376" y1="88" x2="678" y2="88" stroke="#E2E5DE"/>
 <g font-size="10.5" fill="#141613">
  <text x="376" y="106">Same plot captured twice this stage</text>
  <text x="390" y="120" font-size="9.5" fill="#858B81">goes to the conflict queue</text>
  <text x="376" y="142">Area moved the wrong way since last stage</text>
  <text x="390" y="156" font-size="9.5" fill="#858B81">standing crop does not grow back</text>
  <text x="376" y="178">One club far out of line with its neighbours</text>
  <text x="390" y="192" font-size="9.5" fill="#858B81">either something real, or our data is wrong</text>
  <text x="376" y="214" font-weight="700" fill="#8A5206">A whole day that looks too tidy</text>
 </g>
</svg>
<figcaption><b>The split is about who can still act.</b> A check firing on the phone is fixed in ten seconds by the person who caused it. One firing that night becomes somebody's task tomorrow.</figcaption>
</figure>
