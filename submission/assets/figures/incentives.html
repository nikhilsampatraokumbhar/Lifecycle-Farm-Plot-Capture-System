<figure class="fig">
<svg viewBox="0 0 700 152" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <defs><marker id="ai" markerWidth="6" markerHeight="6" refX="5.4" refY="2.8" orient="auto">
   <path d="M0,0 L5.6,2.8 L0,5.6 z" fill="#858B81"/></marker></defs>
 <text x="8" y="12" font-size="10" font-weight="700" fill="#858B81" letter-spacing="1">WHAT YOU PAY FOR IS WHAT YOU GET</text>

 <g>
  <rect x="8" y="20" width="216" height="36" rx="6" fill="#fff" stroke="#CDD2C7" stroke-width="1.4"/>
  <text x="116" y="38" font-size="12" font-weight="700" text-anchor="middle" fill="#141613">Paid per visit closed</text>
  <text x="116" y="51" font-size="10" text-anchor="middle" fill="#4E544C">the usual arrangement</text>
  <line x1="116" y1="58" x2="116" y2="70" stroke="#858B81" stroke-width="1.4" marker-end="url(#ai)"/>
  <rect x="8" y="74" width="216" height="44" rx="6" fill="#FBE9E7" stroke="#E0B4AE" stroke-width="1.4"/>
  <text x="116" y="93" font-size="12" font-weight="700" text-anchor="middle" fill="#9B211B">The fastest path</text>
  <text x="116" y="108" font-size="12" font-weight="700" text-anchor="middle" fill="#9B211B">is to guess</text>
  <text x="116" y="136" font-size="10" text-anchor="middle" fill="#4E544C">Wrong data, and it looks official</text>
 </g>
 <g>
  <rect x="242" y="20" width="216" height="36" rx="6" fill="#fff" stroke="#CDD2C7" stroke-width="1.4"/>
  <text x="350" y="38" font-size="12" font-weight="700" text-anchor="middle" fill="#141613">Paid for clean captures</text>
  <text x="350" y="51" font-size="10" text-anchor="middle" fill="#4E544C">the obvious correction</text>
  <line x1="350" y1="58" x2="350" y2="70" stroke="#858B81" stroke-width="1.4" marker-end="url(#ai)"/>
  <rect x="242" y="74" width="216" height="44" rx="6" fill="#FBE9E7" stroke="#E0B4AE" stroke-width="1.4"/>
  <text x="350" y="93" font-size="12" font-weight="700" text-anchor="middle" fill="#9B211B">The fastest path</text>
  <text x="350" y="108" font-size="12" font-weight="700" text-anchor="middle" fill="#9B211B">is to hide problems</text>
  <text x="350" y="136" font-size="10" text-anchor="middle" fill="#4E544C">The pest damage stops being reported</text>
 </g>
 <g>
  <rect x="476" y="20" width="216" height="36" rx="6" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.6"/>
  <text x="584" y="37" font-size="12" font-weight="700" text-anchor="middle" fill="#0A4F2C">Paid on how the record</text>
  <text x="584" y="50" font-size="12" font-weight="700" text-anchor="middle" fill="#0A4F2C">was actually made</text>
  <line x1="584" y1="58" x2="584" y2="70" stroke="#0E6B3C" stroke-width="1.4" marker-end="url(#ai)"/>
  <rect x="476" y="74" width="216" height="44" rx="6" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="1.6"/>
  <text x="584" y="93" font-size="12" font-weight="700" text-anchor="middle" fill="#0A4F2C">The fastest path</text>
  <text x="584" y="108" font-size="12" font-weight="700" text-anchor="middle" fill="#0A4F2C">is to do it properly</text>
  <text x="584" y="136" font-size="10" text-anchor="middle" fill="#4E544C">Walked, signed, evidenced, in threshold</text>
 </g>
</svg>
<figcaption><b>The middle panel is the trap most people walk into.</b> Rewarding captures that come back clean pays a man to hide the pest damage, the overlap and the plot sown over contract. All four things in the third panel are visible in the capture itself, and none require knowing the true area.</figcaption>
</figure>
