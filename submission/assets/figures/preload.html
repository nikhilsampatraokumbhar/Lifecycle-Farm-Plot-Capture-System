<figure class="fig">
<svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <text x="8" y="15" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">ABOUT 25 MB, DOWNLOADED THE NIGHT BEFORE</text>
 <g>
  <rect x="8"   y="26" width="26"  height="40" fill="#0E6B3C"/>
  <rect x="36"  y="26" width="10"  height="40" fill="#3E8C5F"/>
  <rect x="48"  y="26" width="54"  height="40" fill="#7FB394"/>
  <rect x="104" y="26" width="588" height="40" fill="#8A5206"/>
  <text x="400" y="51" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Satellite pictures for two villages · about 20 MB</text>
 </g>
 <g font-size="10" fill="#4E544C">
  <line x1="21" y1="70" x2="21" y2="82" stroke="#CDD2C7"/><text x="8" y="94" font-weight="700" fill="#141613">1 MB</text><text x="8" y="106">farmers,</text><text x="8" y="117">contracts</text>
  <line x1="75" y1="70" x2="75" y2="82" stroke="#CDD2C7"/><text x="58" y="94" font-weight="700" fill="#141613">2 MB</text><text x="58" y="106">photo</text><text x="58" y="117">thumbnails</text>
  <text x="132" y="94" font-weight="700" fill="#8A5206">80% of the download is map imagery</text>
  <text x="132" y="108" fill="#4E544C">It is the only line that could force a rethink, and the first number I would</text>
  <text x="132" y="120" fill="#4E544C">check on day one against real tile sizes and real phone storage.</text>
 </g>
 <line x1="8" y1="134" x2="692" y2="134" stroke="#E2E5DE"/>
 <g>
  <circle cx="60" cy="158" r="6" fill="#0E6B3C"/>
  <line x1="66" y1="158" x2="300" y2="158" stroke="#CDD2C7" stroke-width="2"/>
  <circle cx="306" cy="158" r="6" fill="#8A5206"/>
  <line x1="312" y1="158" x2="600" y2="158" stroke="#CDD2C7" stroke-width="2"/>
  <circle cx="606" cy="158" r="6" fill="#0E6B3C"/>
  <text x="60"  y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0E6B3C">9:10 pm</text>
  <text x="60"  y="177" font-size="10.5" text-anchor="middle" fill="#4E544C">download</text>
  <text x="306" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#8A5206">7:30 am to 4:40 pm</text>
  <text x="306" y="177" font-size="10.5" text-anchor="middle" fill="#4E544C">no network at all, 20 farmers</text>
  <text x="606" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0E6B3C">8:34 pm</text>
  <text x="606" y="177" font-size="10.5" text-anchor="middle" fill="#4E544C">upload</text>
 </g>

<figcaption><b>If something is missing on arrival, the app degrades rather than dies.</b> GPS needs no network and a shape needs no map. One bad night must not become one lost day for twenty farmers.</figcaption>
