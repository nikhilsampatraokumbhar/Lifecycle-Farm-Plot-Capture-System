<figure class="fig">
<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
 <defs><pattern id="bnd" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
   <rect width="7" height="7" fill="#FBE9E7"/><line x1="0" y1="0" x2="0" y2="7" stroke="#D4756C" stroke-width="3"/></pattern></defs>

 <text x="8" y="16" font-size="10.5" font-weight="700" fill="#858B81" letter-spacing="1">THE SAME 5 METRES OF GPS ERROR, ON TWO PLOTS</text>

 <!-- small plot -->
 <rect x="60" y="46" width="158" height="158" fill="url(#bnd)" stroke="none"/>
 <rect x="78" y="64" width="122" height="122" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="2"/>
 <text x="139" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#0A4F2C">0.5 acre</text>
 <text x="139" y="137" font-size="11" text-anchor="middle" fill="#4E544C">45 m across</text>
 <text x="139" y="228" font-size="22" font-weight="800" text-anchor="middle" fill="#9B211B">44%</text>
 <text x="139" y="243" font-size="10.5" text-anchor="middle" fill="#4E544C">of the plot is uncertain</text>

 <!-- large plot -->
 <rect x="420" y="46" width="180" height="158" fill="url(#bnd)" stroke="none"/>
 <rect x="424" y="50" width="172" height="150" fill="#EAF4EE" stroke="#0E6B3C" stroke-width="2"/>
 <text x="510" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#0A4F2C">10 acres</text>
 <text x="510" y="134" font-size="11" text-anchor="middle" fill="#4E544C">201 m across</text>
 <text x="510" y="228" font-size="22" font-weight="800" text-anchor="middle" fill="#0E6B3C">10%</text>
 <text x="510" y="243" font-size="10.5" text-anchor="middle" fill="#4E544C">of the plot is uncertain</text>

 <!-- middle explainer -->
 <text x="304" y="80" font-size="12" font-weight="700" fill="#141613">Both plots are</text>
 <text x="304" y="96" font-size="12" font-weight="700" fill="#141613">drawn the same</text>
 <text x="304" y="112" font-size="12" font-weight="700" fill="#141613">size here.</text>
 <text x="304" y="136" font-size="11" fill="#4E544C">Only the band</text>
 <text x="304" y="152" font-size="11" fill="#4E544C">is to scale.</text>

 <rect x="252" y="186" width="196" height="26" rx="5" fill="#FBE9E7" stroke="#E0B4AE" stroke-width="1.1"/>
 <rect x="262" y="193" width="13" height="13" fill="url(#bnd)"/>
 <text x="282" y="203" font-size="11" font-weight="700" fill="#9B211B">the uncertain edge, 5 m</text>
</svg>
<figcaption><b>Most people get this wrong: the same GPS error is far more damaging on a small plot than a big one.</b> The uncertainty is all around the edge, and a small plot is almost all edge. Since the brief gives us plots from 0.5 to 10 acres, one flat accuracy number is wrong across most of that range.</figcaption>
</figure>
